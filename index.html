<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f0df"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Busy Bee Tracker</title>
<style>:root{--bg:#faf7ef;--card:#fffdf8;--ink:#3e352c;--muted:#786d61;--a:#c99732;--line:#e6dccd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{padding:18px 16px 12px;background:#f7f0df;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}h1{margin:0;font-size:23px}.sub,small,.label{color:var(--muted);font-size:12px}nav{display:flex;gap:6px;overflow:auto;padding:10px 8px;background:var(--card);position:sticky;top:77px;z-index:4}nav button{border:0;background:#eee5d5;padding:9px 12px;border-radius:18px;white-space:nowrap;color:var(--ink)}nav .on{background:var(--a);color:white}main{padding:14px;max-width:800px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}.stat{font-size:25px;font-weight:700}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:var(--a);color:#fff;font-weight:600}.secondary{background:#eee5d5;color:var(--ink)}input,select{width:100%;padding:10px;border:1px solid #d8cdbc;border-radius:9px;margin:4px 0 10px;background:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.item{padding:10px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:3px 7px;border-radius:12px;background:#eee5d5;font-size:11px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}@media(min-width:650px){.modal{align-items:center}.sheet{max-width:650px;border-radius:18px}}</style></head><body>
<header><h1>🐝 Busy Bee Baked Goods</h1><div class="sub">Market • Consignment • Farm Stand Tracker</div></header><nav id="nav"></nav><main id="app"></main><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K="busyBeeTrackerV3";let db=JSON.parse(localStorage.getItem(K)||"null")||{products:[{id:"p1",name:"Chocolate Chip Cookie",category:"Large Cookies",price:4,cost:1},{id:"p2",name:"Apple Pie Cookie",category:"Large Cookies",price:4,cost:1.1},{id:"p3",name:"Carrot Cake",category:"Cakes",price:5,cost:1.75}],locations:[{id:"home",name:"Home / Kitchen",type:"Home"},{id:"rex",name:"Rexburg Farmer's Market",type:"Market"},{id:"bst",name:"B Street Sidewalk Sales",type:"Market"},{id:"cons",name:"Consignment Store",type:"Consignment"},{id:"farm",name:"Busy Bee Farmer's Stand",type:"Farm Stand"}],inv:{home:{p1:0,p2:0,p3:0},rex:{},bst:{},cons:{},farm:{}},events:[],sales:[]};
db.products.forEach(x=>{if(!x.category)x.category=(/cake/i.test(x.name)?"Cakes":/brownie/i.test(x.name)?"Brownies":/bag/i.test(x.name)?"Cookie Bags":"Large Cookies")});db.sales??=[];db.events.forEach(e=>{e.items??={};Object.values(e.items).forEach(z=>{z.movedSold??=0;z.returned??=0})});function save(){localStorage.setItem(K,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function money(n){return "$"+Number(n||0).toFixed(2)}function p(id){return db.products.find(x=>x.id===id)}function l(id){return db.locations.find(x=>x.id===id)}function q(loc,pid){return +(db.inv[loc]?.[pid]||0)}function setq(loc,pid,n){db.inv[loc]??={};db.inv[loc][pid]=Math.max(0,+n||0)}function move(from,to,pid,n){n=+n||0;if(n<=0)return false;if(from&&q(from,pid)<n){alert("Not enough inventory at the source location.");return false}if(from)setq(from,pid,q(from,pid)-n);if(to)setq(to,pid,q(to,pid)+n);save();return true}
const tabs=[["dash","Dashboard"],["products","Products"],["locations","Locations"],["markets","Markets & Sales"],["reports","Reports"]];function show(t){nav.innerHTML=tabs.map(x=>`<button class="${x[0]==t?"on":""}" onclick="show('${x[0]}')">${x[1]}</button>`).join("");render(t)}
function render(t){app.innerHTML=t=="dash"?dashboard():t=="products"?products():t=="locations"?locations():t=="markets"?markets():reports()}
function dashboard(){let rev=db.events.reduce((s,e)=>s+e.rev,0)+db.sales.filter(e=>!e.eventId).reduce((s,e)=>s+e.rev,0),sold=db.events.reduce((s,e)=>s+e.sold,0)+db.sales.filter(e=>!e.eventId).reduce((s,e)=>s+e.qty,0),out=db.locations.filter(x=>x.type!="Home").reduce((s,x)=>s+db.products.reduce((a,p)=>a+q(x.id,p.id),0),0);return `<div class=grid><div class=card><div class=label>Recorded revenue</div><div class=stat>${money(rev)}</div></div><div class=card><div class=label>Items sold</div><div class=stat>${sold}</div></div><div class=card><div class=label>Items out / stocked</div><div class=stat>${out}</div></div><div class=card><div class=label>Markets / events</div><div class=stat>${db.events.length}</div></div></div><div class=card><h3>Quick actions</h3><div class=row><button onclick=newEvent()>➕ New Market/Event</button><button onclick=restock()>📦 Move / Restock</button><button class=secondary onclick=consale()>💰 Record Sale</button></div></div><div class=card><h3>Inventory by location</h3>${db.locations.map(x=>`<div class=item><b>${x.name}</b> <span class=pill>${x.type}</span><br><small>${db.products.map(p=>p.name+": "+q(x.id,p.id)).join(" • ")}</small></div>`).join("")}</div>`}
function products(){let groups={};db.products.slice().sort((a,b)=>(a.category||"Other").localeCompare(b.category||"Other")||a.name.localeCompare(b.name)).forEach(x=>{(groups[x.category||"Other"]??=[]).push(x)});return `<button onclick=newprod()>➕ Add Product</button><br><br>${Object.keys(groups).sort((a,b)=>a.localeCompare(b)).map(cat=>`<h2>${cat}</h2>${groups[cat].map(x=>`<div class=card><div class=row><div><h3>${x.name}</h3><small>${x.category} • Price ${money(x.price)} • Cost ${money(x.cost)}</small></div><button class=secondary onclick=editprod('${x.id}')>Edit</button></div><div class=item>${db.locations.map(z=>`${z.name}: <b>${q(z.id,x.id)}</b>`).join(" • ")}</div><button onclick=adjust('${x.id}')>Adjust Inventory</button></div>`).join("")}`).join("")}` }
function locations(){return db.locations.map(x=>`<div class=card><h3>${x.name}</h3><span class=pill>${x.type}</span><div class=item>${db.products.map(p=>p.name+": "+q(x.id,p.id)).join(" • ")}</div><button onclick="restock('${x.id}')">Move / Restock Here</button></div>`).join("")+`<button onclick=newloc()>➕ Add Location</button>`}
function markets(){return `<button onclick=newEvent()>➕ New Market/Event</button><br><br>${db.events.length?db.events.slice().reverse().map(e=>`<div class=card><h3>${e.name}</h3><small>${e.date} • ${l(e.loc)?.name||""}</small><p>${e.sold} sold • ${e.ret} returned • <b>${money(e.rev)}</b></p><button onclick=viewevent('${e.id}')>Enter / Edit Sales</button></div>`).join(""):"<div class=card><small>No market events yet.</small></div>"}`}
function reports(){let ps=db.products.slice().sort((a,b)=>(a.category||"Other").localeCompare(b.category||"Other")||a.name.localeCompare(b.name)).map(x=>{let ev=db.events.reduce((a,e)=>a+(e.items[x.id]?.sold||0),0),ledger=db.sales.filter(z=>z.pid==x.id&&!z.eventId).reduce((a,z)=>a+z.qty,0),s=ev+ledger;return `<div class=item><b>${x.category||"Other"} — ${x.name}</b> — ${s} sold — ${money(s*x.price)}</div>`}).join("");let evs=db.events.slice().reverse().map(e=>`<div class=item><b>${e.date} — ${e.name}</b><br>${l(e.loc)?.name||""} • ${e.sold||0} sold • ${money(e.rev||0)}</div>`).join("")||"<small>No market events recorded yet.</small>";let monthly={};db.sales.filter(z=>!z.eventId).forEach(z=>{let month=(z.date||"Undated").slice(0,7),key=z.loc+"|"+month;monthly[key]??={loc:z.loc,month,qty:0,rev:0};monthly[key].qty+=z.qty;monthly[key].rev+=z.rev});let ms=Object.values(monthly).sort((a,b)=>b.month.localeCompare(a.month)||((l(a.loc)?.name||"").localeCompare(l(b.loc)?.name||""))).map(z=>`<div class=item><b>${l(z.loc)?.name||"Unknown location"} — ${z.month}</b><br>${z.qty} sold • ${money(z.rev)}</div>`).join("")||"<small>No ongoing-location sales recorded yet.</small>";let ls=db.locations.filter(x=>x.type!=="Home").map(x=>{let r=db.events.filter(e=>e.loc==x.id).reduce((a,e)=>a+e.rev,0)+db.sales.filter(e=>e.loc==x.id&&!e.eventId).reduce((a,e)=>a+e.rev,0);return `<div class=item><b>${x.name}</b> — ${money(r)}</div>`}).join("");return `<div class=card><h3>Product performance</h3>${ps}</div><div class=card><h3>Sales by market/event</h3>${evs}</div><div class=card><h3>Monthly sales by location</h3>${ms}</div><div class=card><h3>Money by location</h3>${ls}</div><div class=card><h3>Backup</h3><p><small>Export a backup regularly, especially before updating the app.</small></p><button onclick=exportData()>Export Data</button> <button class=secondary onclick=file.click()>Import Data</button><input id=file type=file accept=.json style="display:none" onchange=importData(event)></div>`}
function open(title,body){sheet.innerHTML=`<div class=row><h2>${title}</h2><button class=secondary onclick=closem()>Close</button></div>${body}`;modal.classList.add("show")}function closem(){modal.classList.remove("show")}
function newprod(x){let cats=[...new Set(["Cakes","Large Cookies","Brownies","Cookie Bags","Small Cookies","Bars","Other",...db.products.map(z=>z.category).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));open(x?"Edit Product":"Add Product",`<label>Product name</label><input id=pn value="${x?.name||""}"><label>Product type</label><select id=pcat>${cats.map(c=>`<option ${c===(x?.category||"Large Cookies")?"selected":""}>${c}</option>`).join("")}<option value="__custom">＋ Add a new product type…</option></select><div id=customcatwrap style="display:none"><label>New product type</label><input id=customcat placeholder="e.g. Cupcakes"></div><label>Selling price</label><input id=pp type=number step=.01 value="${x?.price??""}"><label>Cost</label><input id=pc type=number step=.01 value="${x?.cost??""}"><button onclick="saveprod('${x?.id||""}')">Save</button>`);pcat.onchange=()=>{customcatwrap.style.display=pcat.value==="__custom"?"block":"none"}}
function editprod(id){newprod(p(id))}function saveprod(id){let category=pcat.value==="__custom"?customcat.value.trim():pcat.value;let o={id:id||uid(),name:pn.value.trim(),category:category||"Other",price:+pp.value||0,cost:+pc.value||0};if(!o.name)return;if(id)Object.assign(p(id),o);else{db.products.push(o);db.locations.forEach(x=>setq(x.id,o.id,0))}save();closem();show("products")}
function newloc(){open("Add Location",`<label>Name</label><input id=ln><label>Type</label><select id=lt><option>Market</option><option>Consignment</option><option>Farm Stand</option><option>Other</option></select><button onclick=saveloc()>Save</button>`)}function saveloc(){let id=uid();db.locations.push({id,name:ln.value.trim(),type:lt.value});db.inv[id]={};save();closem();show("locations")}
function adjust(pid){open("Adjust Inventory",db.locations.map(x=>`<label>${x.name}</label><input id=a${x.id} type=number value=${q(x.id,pid)}>`).join("")+`<button onclick="saveadj('${pid}')">Save</button>`)}function saveadj(pid){db.locations.forEach(x=>setq(x.id,pid,document.getElementById("a"+x.id).value));save();closem();show("products")}
function restock(dest){open("Move / Restock / Sold",`<label>From location</label><select id=rf>${db.locations.map(x=>`<option value=${x.id} ${x.id===(dest||"home")?"selected":""}>${x.name}</option>`).join("")}</select><label>Move to</label><select id=rt>${db.locations.map(x=>`<option value=${x.id} ${x.id===dest?"selected":""}>${x.name}</option>`).join("")}<option value="__sold">💰 Sold</option></select><div id=eventwrap style="display:none"><label>Market/event (optional)</label><select id=sevent><option value="">Not tied to a specific event</option>${db.events.slice().reverse().map(e=>`<option value="${e.id}">${e.date} — ${e.name}</option>`).join("")}</select></div><label>Product</label><select id=rp>${db.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value=${x.id}>${x.name}</option>`).join("")}</select><label>Quantity</label><input id=rq type=number min=1><label>Date sold / moved</label><input id=mvdate type=date value="${new Date().toISOString().slice(0,10)}"><button onclick=domove()>Save Move / Sale</button>`);rt.onchange=()=>{eventwrap.style.display=rt.value==="__sold"?"block":"none"}}
function domove(){let from=rf.value,to=rt.value,pid=rp.value,n=+rq.value||0;if(!n){alert("Enter a quantity.");return}if(to==="__sold"){let source=l(from),eid=sevent?.value||"";if(eid){let e=db.events.find(x=>x.id===eid),z=e?.items?.[pid];if(!e||e.loc!==from||!z){alert("Choose an event at the selected location that includes this product.");return}if(n>(z.brought||0)-(z.sold||0)){alert("That quantity exceeds the unsold amount recorded for this event. Check the event's brought quantity.");return}if(!move(from,null,pid,n))return;z.sold=(z.sold||0)+n;z.movedSold=(z.movedSold||0)+n;e.sold=(e.sold||0)+n;e.rev=(e.rev||0)+n*p(pid).price;e.ret=Math.max(0,(e.ret||0)-n);db.sales.push({id:uid(),date:mvdate.value,loc:from,pid,qty:n,rev:n*p(pid).price,eventId:eid})}else{if(!source){alert("Choose a source location.");return}if(!move(from,null,pid,n))return;db.sales.push({id:uid(),date:mvdate.value,loc:from,pid,qty:n,rev:n*p(pid).price,eventId:""})}save();closem();show("dash");return}if(from===to){alert("Choose two different locations.");return}if(move(from,to,pid,n)){closem();show("dash")}}
function newEvent(){open("New Market/Event",`<label>Event name</label><input id=en><label>Date</label><input id=ed type=date value=${new Date().toISOString().slice(0,10)}><label>Location</label><select id=el>${db.locations.filter(x=>x.type=="Market"||x.type=="Farm Stand").map(x=>`<option value=${x.id}>${x.name}</option>`).join("")}</select><h3>Products brought</h3>${db.products.map(x=>`<label>${x.name}</label><input class=bring data-p=${x.id} type=number min=0 value=0>`).join("")}<button onclick=saveevent()>Save Event</button>`)}
function saveevent(){let e={id:uid(),name:en.value,date:ed.value,loc:el.value,items:{},sold:0,ret:0,rev:0};document.querySelectorAll(".bring").forEach(x=>{let n=+x.value||0;e.items[x.dataset.p]={brought:n,sold:0,movedSold:0,returned:0};if(n)move("home",e.loc,x.dataset.p,n)});db.events.push(e);save();closem();show("markets")}
function viewevent(id){let e=db.events.find(x=>x.id==id);open(e.name,`<small>${e.date} • ${l(e.loc)?.name||""}</small>${db.products.map(x=>{let z=e.items[x.id]||{brought:0,sold:0};return `<div class=item><b>${x.name}</b><br>Brought ${z.brought} • Sold <input id=s${x.id} type=number min=0 max=${z.brought} value=${z.sold} style="width:70px;display:inline"> • Return ${z.brought-z.sold}</div>`}).join("")}<button onclick="closeevent('${id}')">Save Sales & Return Unsold</button>`)}
function closeevent(id){let e=db.events.find(x=>x.id==id);e.sold=0;e.ret=0;e.rev=0;for(let x of db.products){let z=e.items[x.id]||(e.items[x.id]={brought:0,sold:0,movedSold:0,returned:0});let ns=Math.min(z.brought,Math.max(0,+document.getElementById("s"+x.id).value||0));let delta=ns-z.sold;if(delta>0){if(!move(e.loc,null,x.id,delta))return;z.movedSold=(z.movedSold||0)+delta}else if(delta<0){move(null,e.loc,x.id,-delta);z.movedSold=Math.max(0,(z.movedSold||0)+delta)}z.sold=ns;e.sold+=ns;e.ret+=z.brought-ns;e.rev+=ns*x.price;let shouldReturn=Math.max(0,z.brought-ns),alreadyReturned=z.returned||0;if(shouldReturn>alreadyReturned){if(!move(e.loc,"home",x.id,shouldReturn-alreadyReturned))return;z.returned=shouldReturn}else if(shouldReturn<alreadyReturned){if(!move("home",e.loc,x.id,alreadyReturned-shouldReturn))return;z.returned=shouldReturn}}save();closem();show("markets")}
function consale(){open("Record Sale",`<label>Location</label><select id=sLoc>${db.locations.filter(x=>x.type!=="Home").map(x=>`<option value=${x.id}>${x.name}</option>`).join("")}</select><label>Date</label><input id=sd type=date value="${new Date().toISOString().slice(0,10)}"><label>Product</label><select id=sp>${db.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value=${x.id}>${x.name}</option>`).join("")}</select><label>Quantity sold</label><input id=sq type=number min=1><button onclick=savecs()>Record Sale</button>`)}function savecs(){let x=p(sp.value),n=+sq.value||0,loc=sLoc.value;if(n&&move(loc,null,x.id,n)){db.sales.push({id:uid(),date:sd.value,loc,pid:x.id,qty:n,rev:n*x.price,eventId:""});save();closem();show("dash")}}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="busy-bee-backup.json";a.click()}function importData(e){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();show("dash");alert("Backup imported.")}catch(_){alert("Invalid backup file.")}};r.readAsText(e.target.files[0])}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});show("dash");
</script></body></html>
